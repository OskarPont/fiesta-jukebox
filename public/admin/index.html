<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>fiesta. admin</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#101012">
  <link rel="icon" href="../icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../shared.css">
  <link rel="stylesheet" href="admin.css">
</head>
<body class="admin">
  <div id="toasts" aria-live="polite"></div>
  <p id="srLive" class="sr-only" aria-live="assertive"></p>

  <section id="login" class="login" hidden>
    <form id="loginForm" class="card login-card" autocomplete="off">
      <h1 class="logo big">fiesta<span class="dot">.</span></h1>
      <p class="muted">Panel del anfitrión</p>
      <label class="field"><span>Clave de administrador</span>
        <input id="key" class="input" type="password" autocomplete="current-password" placeholder="Pega tu clave" required>
      </label>
      <p id="loginError" class="form-error" role="alert" hidden></p>
      <button class="btn btn-primary btn-block" type="submit">Entrar</button>
    </form>
  </section>

  <div id="dash" class="dash" hidden>
    <header class="a-top">
      <h1 class="logo">fiesta<span class="dot">.</span> <small>admin</small></h1>
      <div id="topChips" class="top-chips"></div>
      <div class="top-actions">
        <button id="pinJump" class="btn btn-sm pin-jump" type="button" aria-label="Ver PIN y QR de la fiesta" hidden><span id="pinJumpText">PIN</span></button>
        <button id="keysBtn" class="btn btn-sm btn-ghost keys-btn" type="button" aria-keyshortcuts="?" aria-haspopup="dialog"></button>
        <a id="openScreen" class="btn btn-sm" href="../pantalla/" target="_blank" rel="noopener"></a>
        <button id="logout" class="btn btn-sm btn-ghost" type="button"></button>
      </div>
    </header>
    <div id="alerts" class="alerts"></div>
    <main id="cards" class="cards"></main>
  </div>

  <dialog id="keysDlg" class="dlg keys-dlg" aria-labelledby="keysTitle">
    <div class="keys-wrap">
      <div class="keys-head">
        <h2 id="keysTitle" class="keys-title">Atajos de teclado</h2>
        <button id="keysClose" class="btn btn-sm btn-ghost" type="button">Cerrar</button>
      </div>
      <dl class="keys-list">
        <div class="keys-row"><dt><kbd>Espacio</kbd></dt><dd>Pausar o seguir</dd></div>
        <div class="keys-row"><dt><kbd>→</kbd> <kbd>N</kbd></dt><dd>Saltar canción</dd></div>
        <div class="keys-row"><dt><kbd>P</kbd></dt><dd>Ir a PIN y QR</dd></div>
        <div class="keys-row"><dt><kbd>C</kbd></dt><dd>Ir a la cola</dd></div>
        <div class="keys-row"><dt><kbd>I</kbd></dt><dd>Ir a invitados y su buscador</dd></div>
        <div class="keys-row"><dt><kbd>?</kbd></dt><dd>Mostrar u ocultar esta lista</dd></div>
      </dl>
      <p class="keys-note">No funcionan mientras escribes en un campo.</p>
    </div>
  </dialog>

  <script type="module" src="admin.js"></script>
</body>
</html>
