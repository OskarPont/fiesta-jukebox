services:
  fiesta:
    build: .
    container_name: fiesta
    restart: unless-stopped
    env_file: .env
    volumes: ["fiesta-data:/app/data"]
    # Solo escucha en la propia máquina: pon delante un proxy inverso con HTTPS
    # (Caddy, Nginx, Traefik...). Mira el README para un ejemplo.
    ports: ["127.0.0.1:3000:3000"]
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck: { test: ["CMD","wget","-qO-","http://127.0.0.1:3000/fiesta/api/health"], interval: 30s, timeout: 5s, retries: 3 }
    mem_limit: 256m
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
volumes:
  fiesta-data:
